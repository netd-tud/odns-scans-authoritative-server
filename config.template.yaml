# Copy to config.yaml, set the parent domain, and replace the address placeholders.
parent_domain: ""

listen:
  ipv4: "<IPV4_BIND_ADDRESS>"
  ipv6: "<IPV6_BIND_ADDRESS>"
  port: 53

control_ipv4: "<IPV4_CONTROL_ADDRESS>"
control_ipv6: "<IPV6_CONTROL_ADDRESS>"
load_log: "load.csv"
query_log: "queries.csv"
query_log_max_mb: 100
answer_ttl: 600

records:
  "rr-mirror.research.${parent_domain}": {}
  "rr-mirror.research6-only.${parent_domain}": {}
  "rr-mirror.research6.${parent_domain}": {}
  "rr-mirror.research46-slow4.${parent_domain}": {delay_on: ipv4}
  "rr-mirror.research46-slow6.${parent_domain}": {delay_on: ipv6}
  "rr-mirror.research46-nodelay.${parent_domain}": {}

ns_records:
  "rr-mirror.research.${parent_domain}": ipv4
  "research.${parent_domain}": ipv4
  "rr-mirror.research6-only.${parent_domain}": ipv6
  "research6-only.${parent_domain}": ipv6
  "rr-mirror.research6.${parent_domain}": ipv6
  "research6.${parent_domain}": ipv6
  "rr-mirror.research46-slow4.${parent_domain}": dual
  "research46-slow4.${parent_domain}": dual
  "rr-mirror.research46-slow6.${parent_domain}": dual
  "research46-slow6.${parent_domain}": dual
  "rr-mirror.research46-nodelay.${parent_domain}": dual
  "research46-nodelay.${parent_domain}": dual

# Set false to silently drop SOA queries.
serve_soa: true

# Only put delegated zone apexes here. The primary nameserver comes from ns_records.
soa_records:
  "research.${parent_domain}": &soa_defaults
    mailbox: "hostmaster.${parent_domain}"
    serial: 1
    refresh: 7200
    retry: 900
    expire: 1209600
    minimum: 300
    ttl: 600
  "research6-only.${parent_domain}": *soa_defaults
  "research6.${parent_domain}": *soa_defaults
  "research46-slow4.${parent_domain}": *soa_defaults
  "research46-slow6.${parent_domain}": *soa_defaults
  "research46-nodelay.${parent_domain}": *soa_defaults

nameservers:
  ipv4:
    name: "ns.${parent_domain}"
    ipv4: "<IPV4_NAMESERVER_ADDRESS>"
  ipv6:
    name: "ns6.${parent_domain}"
    ipv6: "<IPV6_NAMESERVER_ADDRESS>"
  dual:
    name: "ns46.${parent_domain}"
    ipv4: "<DUAL_STACK_NAMESERVER_IPV4_ADDRESS>"
    ipv6: "<DUAL_STACK_NAMESERVER_IPV6_ADDRESS>"
